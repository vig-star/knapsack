<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title description">
  <title id="title">Four approaches. One weight limit.</title>
  <desc id="description">A Python exploration of the 0/1 knapsack problem, with four algorithms and 39 instances. The example selection has value 309 and fills a capacity of 165.</desc>
  <rect width="1120" height="250" rx="16" fill="#102b2b"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="42" y="49" fill="#9bd3c0" font-size="12" font-weight="700" letter-spacing="2">THE 0/1 KNAPSACK PROBLEM</text>
    <text x="42" y="99" fill="#f5faf7" font-size="34" font-weight="700">Four approaches.</text>
    <text x="42" y="139" fill="#f5faf7" font-size="34" font-weight="700">One weight limit.</text>
    <text x="42" y="180" fill="#bed0ca" font-size="16">Compare solution quality and computation time.</text>
    <text x="42" y="216" fill="#9bd3c0" font-size="13" font-weight="600">PYTHON 3</text>
    <circle cx="126" cy="212" r="2" fill="#6b8e81"/>
