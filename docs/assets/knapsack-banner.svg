    <circle cx="250" cy="212" r="2" fill="#6b8e81"/>
    <text x="264" y="216" fill="#9bd3c0" font-size="13" font-weight="600">STANDARD LIBRARY ONLY</text>
    <rect x="639" y="30" width="451" height="190" rx="12" fill="#193b38" stroke="#36584c"/>
    <text x="663" y="61" fill="#bed0ca" font-size="11" font-weight="700" letter-spacing="1.5">EXAMPLE SELECTION</text>
    <text x="663" y="105" fill="#f5faf7" font-size="32" font-weight="700">309</text>
    <text x="733" y="104" fill="#bed0ca" font-size="14">total value</text>
    <text x="663" y="139" fill="#bed0ca" font-size="12">Capacity used</text>
    <text x="1066" y="139" text-anchor="end" fill="#f5faf7" font-size="12" font-weight="700">165 / 165</text>
    <rect x="663" y="153" width="403" height="23" rx="5" fill="#284b43"/>
    <path d="M668 153h51v23h-51a5 5 0 0 1-5-5v-13a5 5 0 0 1 5-5Z" fill="#a7e0c8"/>
    <rect x="721" y="153" width="74" height="23" fill="#83c8af"/>
